# This file generates the GitHub Actions matrix.
---
include:
# Central = Right
  - board: seeeduino_xiao_ble
    shield: lism_left rgbled_adapter
    snippet: non-trackball-peripheral
    artifact-name: lism_left_peripheral_non_trackball
  - board: seeeduino_xiao_ble
    shield: lism_left rgbled_adapter
    snippet: trackball-peripheral
    artifact-name: lism_left_peripheral_trackball
  - board: seeeduino_xiao_ble
    shield: lism_right rgbled_adapter
    snippet: non-trackball-central
    artifact-name: lism_right_central_non_trackball
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
  - board: seeeduino_xiao_ble
    shield: lism_right rgbled_adapter
    snippet: trackball-central
    artifact-name: lism_right_central_trackball
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
  
  - board: seeeduino_xiao_ble
    shield: lism_right rgbled_adapter
    artifact-name: lism_right_central_non_trackball_studio
    snippet: "studio-rpc-usb-uart non-trackball-central"
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
  - board: seeeduino_xiao_ble
    shield: lism_right rgbled_adapter
    artifact-name: lism_right_central_trackball_studio
    snippet: "studio-rpc-usb-uart trackball-central"
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  # ログ版 (USB の COM ポートにデバッグログを出す。Studio は入らない)。zmk-config-keyboards の
  # tools/keyboard-check.cmd の「レイヤーの動きを見る」で、押したキーのレイヤーの遷移と解決を表示するのに使う。
  # ボールを動かすと入力プロセッサのログが増えるので、ログのバッファを大きくする
  - board: seeeduino_xiao_ble
    shield: lism_right rgbled_adapter
    artifact-name: lism_right_central_non_trackball_logging
    snippet: "zmk-usb-logging non-trackball-central"
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_LOG_BUFFER_SIZE=32768
  - board: seeeduino_xiao_ble
    shield: lism_right rgbled_adapter
    artifact-name: lism_right_central_trackball_logging
    snippet: "zmk-usb-logging trackball-central"
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_LOG_BUFFER_SIZE=32768

