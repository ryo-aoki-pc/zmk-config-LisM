name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

# ビルド結果 (build.yaml の全 .uf2) は、次のタグのプレリリースにも置く (.github/scripts/firmware-release.sh)。
# 認証なしで取得でき、Artifacts と違って期限切れにならない:
#   firmware-latest         custom ブランチの最新ビルド (push のたびに置き換える)
#   firmware-custom-<sha7>  custom ブランチのビルドの履歴 (新しいものから 30 件を残す)
#   firmware-pr-<番号>      PR のビルド (PR に push するたびに置き換える。新しいものから 30 件を残す)
#   https://github.com/<owner>/<repo>/releases/download/<タグ>/<artifact-name>.uf2
#   https://github.com/<owner>/<repo>/releases/download/<タグ>/BUILD_INFO.txt
# zmk-config-keyboards の tools/flash.cmd は、ここから選んだビルドを書き込む。
# build-user-config.yml は全ビルドが成功したときだけ .uf2 を成果物 firmware にまとめる。
# 1 つでも失敗すると build が失敗になり、公開のジョブは動かない (一部だけの公開にはならない)。

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0

  publish-latest:
    name: Publish firmware-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/custom'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Publish firmware-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          DESCRIPTION: build.yaml の全ファームウェア
        run: bash .github/scripts/firmware-release.sh latest firmware/*.uf2

  # 待機中のジョブは、同じグループの新しいジョブに取り消されるので、コミットごとにグループを分ける
  # (続けて push しても、それぞれのビルドが履歴に残る)
  publish-custom:
    name: Publish firmware-custom
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/custom'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-custom-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Publish firmware-custom-<sha7>
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          DESCRIPTION: build.yaml の全ファームウェア
          KEEP: '30'
        run: bash .github/scripts/firmware-release.sh custom firmware/*.uf2

  # 同じリポジトリのブランチからの PR だけ (fork と Dependabot の PR は書き込み権限が無い)
  publish-pr:
    name: Publish firmware-pr
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Publish firmware-pr-<number>
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          DESCRIPTION: build.yaml の全ファームウェア
          KEEP: '30'
        run: bash .github/scripts/firmware-release.sh pr firmware/*.uf2
